<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ayde</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-stars" aria-hidden="true"></div>
  <div class="stars stars-a" aria-hidden="true"></div>
  <div class="stars stars-b" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">ayde</div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="new-tab" id="new-tab" title="New tab" aria-label="New tab">+</button>
  </header>

  <main class="browser">
    <section class="start-screen" id="start-screen">
      <div class="home">
        <h1 class="logo">ayde</h1>
        <form id="search-form" autocomplete="off">
          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input id="search" type="text" placeholder="search the web..." autofocus
              autocomplete="off" spellcheck="false" aria-label="Search the web">
            <button type="submit" aria-label="Search">↵</button>
          </div>
        </form>
        <p class="hint">DuckDuckGo · no search history saved by ayde</p>

        <div class="section-header"><span>Quick apps</span></div>
        <div class="apps-grid">
          <button class="app" data-url="https://www.youtube.com/" data-title="YouTube"><div class="icon yt">▶</div><span>YouTube</span></button>
          <button class="app" data-url="https://github.com/" data-title="GitHub"><div class="icon gh">⌘</div><span>GitHub</span></button>
          <button class="app" data-url="https://discord.com/app" data-title="Discord"><div class="icon dc">◌</div><span>Discord</span></button>
          <button class="app" data-url="https://www.tiktok.com/" data-title="TikTok"><div class="icon tt">♪</div><span>TikTok</span></button>
          <button class="app" data-url="https://www.google.com/" data-title="Google"><div class="icon go">G</div><span>Google</span></button>
          <button class="app" data-url="https://x.com/" data-title="X"><div class="icon x">𝕏</div><span>X</span></button>
          <button class="app" data-url="https://www.roblox.com/" data-title="Roblox"><div class="icon rb">R</div><span>Roblox</span></button>
          <button class="app" data-url="https://play.geforcenow.com/" data-title="GeForce Now"><div class="icon gfn">▶</div><span>GeForce</span></button>
          <button class="app" data-url="https://duckduckgo.com/?q=movies" data-title="Movies"><div class="icon">✦</div><span>Movies</span></button>
          <button class="app" data-url="https://duckduckgo.com/?q=games" data-title="Games"><div class="icon">◇</div><span>Games</span></button>
          <button class="app" data-url="https://duckduckgo.com/?q=ai" data-title="AI"><div class="icon">✧</div><span>AI</span></button>
          <button class="app" data-url="https://duckduckgo.com/?q=music" data-title="Music"><div class="icon">♫</div><span>Music</span></button>
        </div>
      </div>
    </section>

    <section class="page-screen" id="page-screen" hidden>
      <div class="page-toolbar">
        <button id="back" title="Back" aria-label="Back">‹</button>
        <button id="forward" title="Forward" aria-label="Forward">›</button>
        <button id="reload" title="Reload" aria-label="Reload">↻</button>
        <div class="address" id="address">duckduckgo.com</div>
        <button id="home-btn" title="Home" aria-label="Home">⌂</button>
      </div>
      <div class="frame-wrap">
        <iframe id="webview" title="Ayde web view" referrerpolicy="no-referrer"></iframe>
        <div class="frame-fallback" id="frame-fallback" hidden>
          <div>
            <strong>This site won't display inside ayde.</strong>
            <p>Some websites block embedded views for security. Your search tab still stays inside ayde, but this site must be opened directly.</p>
            <button id="open-direct">Open directly</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
